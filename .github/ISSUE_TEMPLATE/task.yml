name: Task / feature
description: Plan a trackable unit of product or engineering work
title: "[Task]: "
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the frontend does this primarily affect?
      options:
        - Authentication and access
        - Courses and enrollment
        - Learning and assessment
        - Workspace and notes
        - Collaboration
        - Dashboard and planning
        - Instructor experience
        - Administration
        - Infrastructure and quality
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Describe the problem or deliverable. Focus on the outcome rather than implementation details.
      placeholder: A student should be able to...
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included and explicitly not included?
      placeholder: |
        Included:
        -
        Not included:
        -
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that make this task complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: What automated tests, manual checks, screenshots, or measurements should demonstrate completion?
      placeholder: |
        - Vitest/RTL:
        - MSW/API:
        - Manual:
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / blockers
      description: Link related issues, backend work, designs, or external dependencies.
      placeholder: "Depends on #..."
